services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freight_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-freight_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freight_pilot}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
